<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480">
<defs>
    <style>
        .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0F172A; }
        .subtitle { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
        .box-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #1E293B; }
        .box-sub { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #334155; }
        .box-code { font-family: 'Courier New', Courier, monospace; font-size: 9px; fill: #0F172A; }
        .label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 10px; fill: #475569; }
        .val { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #0F172A; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>

        <rect x="30" y="40" width="275" height="190" rx="6" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.6"/>
        <rect x="30" y="40" width="275" height="28" rx="6" fill="#E0F2FE"/>
        <text x="40" y="58" font-family="Arial" font-size="11" font-weight="bold" fill="#0284C7">1. LEXICAL OBFUSCATION</text>
        <text x="42" y="84" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Variable & Function Renaming</text><text x="42" y="102" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- High-entropy randomized identifiers</text><text x="42" y="120" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- E.g., $a1_x9z_8k = ...</text><text x="42" y="138" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Whitespace & Comment Stripping</text><text x="42" y="156" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Removal of structural indentation</text><text x="42" y="174" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Formatting obfuscation to deter analysts</text>
        <rect x="330" y="40" width="275" height="190" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.6"/>
        <rect x="330" y="40" width="275" height="28" rx="6" fill="#DBEAFE"/>
        <text x="340" y="58" font-family="Arial" font-size="11" font-weight="bold" fill="#2563EB">2. DATA ENCODING & CIPHERS</text>
        <text x="342" y="84" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Multi-Layer Base64 Streams</text><text x="342" y="102" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Nested payloads decoded at execution</text><text x="342" y="120" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">XOR & RC4 Stream Ciphers</text><text x="342" y="138" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Dynamic in-memory payload decryption</text><text x="342" y="156" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Character Array Splitting</text><text x="342" y="174" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- [char[]](104,116,116,112) string reassembly</text>
        <rect x="630" y="40" width="275" height="190" rx="6" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.6"/>
        <rect x="630" y="40" width="275" height="28" rx="6" fill="#EDE9FE"/>
        <text x="640" y="58" font-family="Arial" font-size="11" font-weight="bold" fill="#7C3AED">3. CONTROL FLOW FLATTENING</text>
        <text x="642" y="84" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Opaque Predicate Insertion</text><text x="642" y="102" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Invariant conditional branches (always true/false)</text><text x="642" y="120" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Switch-Case Dispatch Loops</text><text x="642" y="138" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Flattening sequential blocks into state loops</text><text x="642" y="156" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Junk Code & NOP Sledding</text><text x="642" y="174" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Dead arithmetic to distort signature hashes</text>
        <rect x="30" y="255" width="275" height="190" rx="6" fill="#F8FAFC" stroke="#059669" stroke-width="1.6"/>
        <rect x="30" y="255" width="275" height="28" rx="6" fill="#D1FAE5"/>
        <text x="40" y="273" font-family="Arial" font-size="11" font-weight="bold" fill="#059669">4. DYNAMIC API RESOLUTION</text>
        <text x="42" y="299" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">GetProcAddress & LoadLibrary</text><text x="42" y="317" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Circumvents Import Address Table (IAT)</text><text x="42" y="335" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Hash-Based API Resolving</text><text x="42" y="353" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- ROR-13 API hashing to mask function names</text><text x="42" y="371" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Direct System Calls (Syscalls)</text><text x="42" y="389" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Bypasses user-mode EDR inline hooks</text>
        <rect x="330" y="255" width="275" height="190" rx="6" fill="#F8FAFC" stroke="#D97706" stroke-width="1.6"/>
        <rect x="330" y="255" width="275" height="28" rx="6" fill="#FEF3C7"/>
        <text x="340" y="273" font-family="Arial" font-size="11" font-weight="bold" fill="#D97706">5. ANTI-ANALYSIS DEFENSES</text>
        <text x="342" y="299" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Virtual Machine & Sandbox Evasion</text><text x="342" y="317" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- CPID, hypervisor registry, and MAC checks</text><text x="342" y="335" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Debugger Detection Routines</text><text x="342" y="353" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- IsDebuggerPresent, OutputDebugString tricks</text><text x="342" y="371" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Extended Sleep / Stalling Delays</text><text x="342" y="389" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Bypasses sandbox automated timeout windows</text>
        <rect x="630" y="255" width="275" height="190" rx="6" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.6"/>
        <rect x="630" y="255" width="275" height="28" rx="6" fill="#FEE2E2"/>
        <text x="640" y="273" font-family="Arial" font-size="11" font-weight="bold" fill="#DC2626">6. CODE PACKING & DROPPERS</text>
        <text x="642" y="299" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Staged Payload Execution</text><text x="642" y="317" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Lightweight stager downloads C2 payload</text><text x="642" y="335" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">In-Memory Process Injection (T1055)</text><text x="642" y="353" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- VirtualAllocEx -> WriteProcessMemory -> Run</text><text x="642" y="371" font-family="Arial" font-size="10" font-weight="bold" fill="#0F172A">Process Hollowing & Reflective DLL</text><text x="642" y="389" font-family="Arial" font-size="9" font-weight="normal" fill="#334155">- Injects malicious PE into legitimate process</text></svg>