    <text x="45" y="58" font-family="Arial" font-size="11" font-weight="bold" fill="#1E293B">### SYSTEM INSTRUCTION &amp; FORENSIC CONTEXT PROMPT (Llama-3.1-8B-Instruct)</text>
    
    <text x="45" y="88" class="box-code" font-weight="bold" fill="#2563EB">### Instruction:</text>
    <text x="45" y="105" class="box-code" fill="#334155">You are an expert reverse engineer and malware analyst. Analyze the following decompiled/deobfuscated</text>
    <text x="45" y="120" class="box-code" fill="#334155">code snippet. Extract: (1) Primary malicious intent, (2) Critical Win32 APIs, (3) MITRE ATT&amp;CK tactics,</text>
    <text x="45" y="135" class="box-code" fill="#334155">and (4) Confidence score. Output strictly valid JSON conforming to the schema below. Do not generate markdown.</text>
    
    <text x="45" y="165" class="box-code" font-weight="bold" fill="#D97706">### Input Code Snippet (AST-Normalized):</text>
    <text x="45" y="182" class="box-code" fill="#334155">/* DECODED_B64_LAYER_1 */ VirtualAllocEx(hProcess, NULL, size, MEM_COMMIT, PAGE_EXECUTE_READWRITE);</text>
    <text x="45" y="197" class="box-code" fill="#334155">WriteProcessMemory(hProcess, pBase, shellcode, size, NULL); CreateRemoteThread(hProcess, 0, 0, pBase, 0, 0, 0);</text>
    
    <text x="45" y="225" class="box-code" font-weight="bold" fill="#059669">### Target JSON Schema Output:</text>
    <text x="45" y="242" class="box-code" fill="#0F172A">{{"intent_summary": "Process Injection into remote host", "observed_apis": ["VirtualAllocEx", "WriteProcessMemory"],</text>
    <text x="45" y="257" class="box-code" fill="#0F172A"> "mitre_tactics": ["T1055: Process Injection", "T1106: Native API"], "predicted_verdict": "MALICIOUS"}}</text>
    
