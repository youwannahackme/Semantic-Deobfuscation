<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
<defs>
    <style>
        .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0F172A; }
        .subtitle { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
        .box-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #1E293B; }
        .box-sub { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #334155; }
        .box-code { font-family: 'Courier New', Courier, monospace; font-size: 9px; fill: #0F172A; }
        .label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 10px; fill: #475569; }
        .val { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #0F172A; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>

    <rect x="30" y="40" width="480" height="290" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="45" y="66" class="box-title">End-to-End Latency vs Manual Analysis Bottleneck</text>
    
    <!-- Manual Analysis -->
    <text x="45" y="100" class="label" font-weight="bold">Manual Reverse Engineering (Ghidra Analyst)</text>
    <rect x="45" y="110" width="440" height="35" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
    <rect x="45" y="110" width="410" height="35" rx="3" fill="#EF4444"/>
    <text x="55" y="132" font-family="Arial" font-size="10.5" font-weight="bold" fill="#FFFFFF">45 – 120 minutes (Mean: 82.5 minutes)</text>
    <text x="390" y="132" font-family="Arial" font-size="9" font-weight="bold" fill="#FFF">Bottleneck</text>
    
    <!-- Proposed Automated Pipeline -->
    <text x="45" y="180" class="label" font-weight="bold">Proposed Automated Pipeline (Empirical Wall-Clock)</text>
    <rect x="45" y="190" width="440" height="35" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
    <rect x="45" y="190" width="35" height="35" rx="3" fill="#22C55E"/>
    <text x="90" y="212" font-family="Arial" font-size="10.5" font-weight="bold" fill="#15803D">13.55 milliseconds per sample (0.014 s)</text>
    <text x="390" y="212" font-family="Arial" font-size="9" font-weight="bold" fill="#15803D">Sub-Second</text>
    
    <text x="45" y="260" font-family="Arial" font-size="9.5" fill="#475569">Key Empirical Finding: Fully automated multi-stage deobfuscation executes in</text>
    <text x="45" y="276" font-family="Arial" font-size="9.5" fill="#475569">sub-50 ms latencies, enabling inline SIEM / EDR alert triage at enterprise scale.</text>
    <text x="45" y="296" font-family="Arial" font-size="9.5" font-weight="bold" fill="#15803D">Throughput: &gt;2,000 samples per minute on single CPU thread.</text>
    
    <rect x="530" y="40" width="340" height="290" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
    <text x="545" y="66" class="box-title">Stage Latency Breakdown (Mean: 13.55 ms)</text>
    
    <rect x="545" y="85" width="310" height="42" rx="3" fill="#E0F2FE" stroke="#0284C7"/>
    <text x="555" y="103" font-family="Arial" font-size="9.5" font-weight="bold" fill="#0369A1">Stage 1a: Ingestion &amp; Safety Hash (0.12 ms)</text>
    <text x="555" y="117" font-family="Arial" font-size="8.5" fill="#0284C7">Cryptographic SHA-256 fingerprinting &amp; non-execution bounds</text>
    
    <rect x="545" y="133" width="310" height="42" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
    <text x="555" y="151" font-family="Arial" font-size="9.5" font-weight="bold" fill="#1D4ED8">Stage 1b: AST Normalization (7.27 ms)</text>
    <text x="555" y="165" font-family="Arial" font-size="8.5" fill="#2563EB">Multi-layer Base64 unwrapping &amp; string concat folding</text>
    
    <rect x="545" y="181" width="310" height="42" rx="3" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="555" y="199" font-family="Arial" font-size="9.5" font-weight="bold" fill="#6D28D9">Stage 2: API Tokenization &amp; Chunks (4.88 ms)</text>
    <text x="555" y="213" font-family="Arial" font-size="8.5" fill="#7C3AED">Atomic Win32 preservation &amp; 4,096-token sliding windows</text>
    
    <rect x="545" y="229" width="310" height="42" rx="3" fill="#FEF3C7" stroke="#D97706"/>
    <text x="555" y="247" font-family="Arial" font-size="9.5" font-weight="bold" fill="#B45309">Stage 3: Semantic Reconstruction (0.45 ms)</text>
    <text x="555" y="261" font-family="Arial" font-size="8.5" fill="#D97706">Zero-shot transformer intent extraction &amp; attention salience</text>

    <rect x="545" y="277" width="310" height="42" rx="3" fill="#D1FAE5" stroke="#059669"/>
    <text x="555" y="295" font-family="Arial" font-size="9.5" font-weight="bold" fill="#047857">Stage 4: Evidence Verifier &amp; MITRE (0.83 ms)</text>
    <text x="555" y="309" font-family="Arial" font-size="8.5" fill="#059669">Factual token intersection validation &amp; ATT&amp;CK TTP mapping</text>
    </svg>